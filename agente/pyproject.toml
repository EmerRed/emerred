[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisynth"
version = "0.1.0"
description = "Agente inteligente CLI para recolección multicanal y síntesis profunda de información con Google Gemini."
authors = [{ name = "OmniSynth Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.18.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.10",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "ddgs>=9.0.0",
    "duckduckgo-search>=8.0.0",
    "trafilatura>=2.0.0",
    "wikipedia-api>=0.7.0",
    "lxml>=5.0.0",
]

[project.scripts]
synth = "synth.cli:app"
omnisynth = "synth.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["synth*"]
