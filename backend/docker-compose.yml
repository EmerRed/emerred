version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emerred-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/emerred_db
      - PORT=3000
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mongo:
    image: mongo:7
    container_name: emerred-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=emerred_db
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data: